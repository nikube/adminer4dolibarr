; PHP configuration for Adminer4Dolibarr module
; This file increases PHP limits to handle Adminer's requirements
;
; Note: This file works on servers with CGI/FastCGI PHP
; If you're using Apache with mod_php, use .htaccess instead
; If neither works, configure these settings in your server's php.ini

; Maximum number of input variables (for large forms/tables)
max_input_vars = 10000

; Maximum POST data size
post_max_size = 128M

; Maximum upload file size
upload_max_filesize = 128M

; Maximum execution time (5 minutes for large operations)
max_execution_time = 300

; Memory limit
memory_limit = 256M

; Maximum input nesting level
max_input_nesting_level = 128
